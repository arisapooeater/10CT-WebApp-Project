<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8">
      <meta name="viewport"
      content="width=device-width,
      initial-scale=1.0">
    <link rel="stylesheet" href="./css-files/style.css">
    <link rel="stylesheet" href="./css-files/catalogue-filter.css">
    <script src="./js-files/script.js" defer></script>
    <script src="./js-files/products.js" defer></script>
    <script src="./js-files/multiselect-dropdown.js"></script>
    <title>KRAFTY</title>
    <link rel="icon" href="./HTML-graphics/KRAFTY_logo.png">
  </head>
  <body class="margin-page">
    <div id="nav-placeholder"></div>
    <h2>App & Website Finder</h2>

    <!-- App/Websites Filters + Grid -->
    <section class="Apps/Websites Container" id="product">
        <div class="filters">
            <label for="priceFilter">Price:  </label>
            <select id="priceFilter" name="select" multiple>
              <option value="free" selected>Free</option>
              <option value="one-time-payment" selected>One-time payment</option>
              <option value="subscription-based" selected>Subscription-based</option>
            </select>
        </div>
        <div class="filters">
            <label for="typeFilter">Purpose:  </label>
            <select id="typeFilter" name="select" multiple>
                <option value="drawing" selected>Drawing</option>
                <option value="animation" selected>Animation</option>
                <option value="croquis-reference" selected>Croquis/reference</option>
                <option value="commissions" selected>Commissions</option>
                <option value="image-video-editing" selected>Image/Video Editing</option>
                <option value="textures-graphics" selected>Textures/graphics</option>
                <option value="other" selected>Other</option>
            </select>
        </div>
        
        
        <div class="grid">
      
        </div>
    </section>
  </body>
</html>
