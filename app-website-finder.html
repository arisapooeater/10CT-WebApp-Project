<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8">
      <meta name="viewport"
      content="width=device-width,
      initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="catalogue-filter.css">
    <script src="./js-files/script.js" defer></script>
    <script src="./js-files/products.js" defer></script>
    <script src="./js-files/multiselect-dropdown.js"></script>
    <title>KRAFTY</title>
    <link rel="icon" href="./HTML-graphics/substitutefornow.jpg">
  </head>
  <body class="margin-page">
    <div id="nav-placeholder"></div>
    <h2>App & Website Finder</h2>

    <!-- App/Websites Filters + Grid -->
    <section class="Apps/Websites Container" id="product">
        <div class="filters">
            <label for="priceFilter">Price:  </label>
            <select id="priceFilter">
              <option value="all">All</option>
              <option value="free">Free</option>
              <option value="one-time-payment">One-time payment</option>
              <option value="subscription">Subscription-based</option>
            </select>
        </div>
        <div class="filters">
            <label for="typeFilter">Purpose:  </label>
            <select id="typeFilter" name="select" multiple>
                <option value="drawing">Drawing</option>
                <option value="animation">Animation</option>
                <option value="croquis-reference">Croquis/reference</option>
                <option value="commissions">Commissions</option>
                <option value="image-video-editing">Image/Video Editing</option>
                <option value="textures-graphics">Textures/graphics</option>
                <option value="other">Other</option>
            </select>
        </div>
        
        
        <div class="grid">
      
        </div>
    </section>
  </body>
</html>
